name: Refresh vulnerable dependencies

on:
  push:
    branches:
      - chore/security-dependency-updates

concurrency:
  group: security-dependency-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh patched dependency versions
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || echo "Some remaining advisories require breaking dependency changes; review them separately."
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh npm lockfile [skip ci]"
          git push
